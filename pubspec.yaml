name: shadowtrace
description: "ShadowTrace – Personal Safety Travel App with Real-Time Tracking"

publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # AWS & Cognito
  amplify_flutter: ^2.3.0
  amplify_auth_cognito: ^2.3.0
  aws_common: ^0.7.12
  aws_signature_v4: ^0.6.9

  # Maps & Location
  maplibre_gl: ^0.26.0
  geolocator: ^10.1.0
  latlong2: ^0.9.1
  location: ^5.0.3

  # Speech & Voice
  speech_to_text: ^6.6.0
  flutter_tts: ^4.1.0

  # HTTP & Networking
  http: ^1.2.1
  dio: ^5.4.0
  connectivity_plus: ^5.0.2
  web_socket_channel: ^2.4.0

  # Storage
  sqflite: ^2.3.0
  shared_preferences: ^2.2.2

  # UI
  lottie: ^3.1.3

  # Audio
  just_audio: ^0.9.36

  # State Management
  provider: ^6.1.2

  # Utilities
  intl: ^0.19.0
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/animations/
    - assets/images/
