name: shadowtrace
description: "ShadowTrace – Personal Safety Travel App with Real-Time Tracking"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # AWS & Cognito
  amplify_flutter: ^2.3.0
  amplify_auth_cognito: ^2.3.0
  aws_common: ^0.7.12
  aws_signature_v4: ^0.6.9

  # Maps & Location
  maplibre_gl: ^0.26.0
  geolocator: ^9.0.2
  latlong2: ^0.9.1
  location: ^5.0.1

  # Speech & Voice
  speech_to_text: ^6.3.0
  flutter_tts: ^4.1.0

  # HTTP & Networking
  http: ^1.1.0
  dio: ^5.6.0
  connectivity_plus: ^5.0.2
  web_socket_channel: ^2.4.0

  # Local Storage & Persistence
  sqflite: ^2.2.8
  flutter_secure_storage: ^9.0.2
  shared_preferences: ^2.1.1
  flutter_dotenv: ^5.1.0

  # State Management & DI
  get_it: ^7.5.0
  provider: ^6.0.0
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0

  # Hardware & Device
  vibration: ^1.8.4
  flutter_local_notifications: ^17.2.2
  permission_handler: ^12.0.0+1

  # Firebase
  firebase_core: ^3.4.1
  firebase_messaging: ^15.2.10

  # Audio
  just_audio: ^0.9.34
  record: ^5.0.0

  # UI & Utilities
  cupertino_icons: ^1.0.2
  google_fonts: ^5.1.0
  lottie: ^3.3.3
  flutter_animate: ^4.4.0
  glassmorphism: ^3.0.0
  go_router: ^14.1.0
  logger: ^2.2.0
  font_awesome_flutter: ^10.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  mockito: ^5.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/sounds/
    - assets/images/
    - assets/
