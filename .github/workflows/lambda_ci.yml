name: Lambda CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/lambda_ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'

env:
  AWS_REGION: us-east-1

jobs:
  test-and-lint:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run tests
        working-directory: ./backend
        run: npm test

      - name: Run linter
        working-directory: ./backend
        run: npm run lint || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/coverage/

  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: test-and-lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_DEV }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to CloudFormation (Dev)
        working-directory: ./backend
        run: |
          aws cloudformation deploy \
            --template-file infra/shadowtrace_full_stack.yaml \
            --stack-name shadowtrace-dev \
            --capabilities CAPABILITY_NAMED_IAM \
            --region ${{ env.AWS_REGION }} \
            --parameter-overrides \
              EnvironmentName=dev \
              OpenAIApiKey=${{ secrets.OPENAI_API_KEY }}

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: test-and-lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production
      url: https://shadowtrace.prod/

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_PROD }}
          role-duration-seconds: 3600

      - name: Deploy to CloudFormation (Prod)
        working-directory: ./backend
        run: |
          aws cloudformation deploy \
            --template-file infra/shadowtrace_full_stack.yaml \
            --stack-name shadowtrace-prod \
            --capabilities CAPABILITY_NAMED_IAM \
            --region ${{ env.AWS_REGION }} \
            --parameter-overrides \
              EnvironmentName=prod \
              OpenAIApiKey=${{ secrets.OPENAI_API_KEY }} \
            --no-fail-on-empty-changeset

      - name: Create deployment notification
        run: |
          echo "Deployed to Production"
          echo "Region: ${{ env.AWS_REGION }}"
          echo "Stack: shadowtrace-prod"

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: [deploy-prod]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Wait for deployment
        run: sleep 30

      - name: Health check endpoints
        run: |
          curl -f https://bt0afo9upa.execute-api.us-east-1.amazonaws.com/dev/health || exit 1
          curl -f https://ycr7hmmo89.execute-api.us-east-1.amazonaws.com/dev/health || exit 1

      - name: Post deployment success
        if: success()
        run: echo "✅ Production deployment successful and healthy"
