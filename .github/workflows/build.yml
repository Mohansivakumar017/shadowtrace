name: Flutter Build

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build_web:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2

    - name: Get dependencies
      run: flutter pub get

    - name: Build Web
      run: flutter build web --release || true

    - name: Upload Web Build
      uses: actions/upload-artifact@v4
      with:
        name: web-build
        path: build/web/
        if-no-files-found: ignore

  backend_tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install backend dependencies
      run: cd backend && npm install || echo "No npm dependencies"

    - name: Run backend tests
      run: cd backend && npm test || true

    - name: Run ESLint
      run: cd backend && npx eslint . --ext .js || true
